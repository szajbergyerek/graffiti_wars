name: Build, push, and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install WireGuard
        run: sudo apt-get update && sudo apt-get install -y wireguard

      - name: Write WireGuard config
        run: |
          umask 077
          # Drop the DNS line - wg-quick would otherwise need resolvconf/openresolv
          # (not available on this runner image) just to apply it, and the runner
          # doesn't need it: only the routed subnets matter for reaching the
          # Portainer webhook, not which DNS server answers the lookup.
          echo "${{ secrets.WG_CONFIG }}" | grep -v '^DNS' > wg0.conf
          sudo mv wg0.conf /etc/wireguard/wg0.conf

      - name: Bring up WireGuard tunnel
        run: sudo wg-quick up wg0

      - name: Trigger Portainer redeploy
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

      - name: Bring down WireGuard tunnel
        if: always()
        run: sudo wg-quick down wg0 || true
