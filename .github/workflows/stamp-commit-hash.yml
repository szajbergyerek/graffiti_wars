name: Stamp commit hash into docker-compose.yml

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stamp:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write commit hash into the first line of docker-compose.yml
        run: |
          sed -i "1s/.*/# ${GITHUB_SHA}/" docker-compose.yml

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git diff --cached --quiet || git commit -m "chore: stamp docker-compose.yml with commit hash [skip ci]"
          git push
