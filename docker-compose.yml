services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS:?set DATABASE_PASS}
    volumes:
      - ${STORAGE_PATH:?set STORAGE_PATH}/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:?set DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?set DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER:?set DATABASE_USER}
      DATABASE_PASS: ${DATABASE_PASS:?set DATABASE_PASS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
    ports:
      - "${WEB_PORT:?set WEB_PORT}:5000"
    volumes:
      - ${STORAGE_PATH:?set STORAGE_PATH}/website:/app/assets