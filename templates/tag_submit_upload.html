{% extends "base.html" %}
{% block title %}{{ t('title.tag_submit') }} - Graffiti Wars{% endblock %}
{% block header_nav %}
<a href="{{ url_for('tags.map_view') }}" class="app-header-back">
  <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
</a>
{% endblock %}
{% block tab_bar %}{% endblock %}
{% block extra_head %}
<style>
  .camera-wrap { position: relative; height: 100%; background: #000; overflow: hidden; }
  .camera-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera-shutter-row {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 28px);
    display: flex; justify-content: center;
  }
  .camera-shutter-btn {
    width: 72px; height: 72px; border-radius: 999px; background: #fff;
    border: 4px solid rgba(255, 255, 255, 0.4); cursor: pointer; padding: 0;
  }
  .camera-shutter-btn:active { transform: scale(0.92); }
  .camera-shutter-btn:disabled { opacity: 0.5; }
  .camera-message {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; text-align: center; padding: 24px; color: var(--text-muted);
  }
  .camera-status-banner {
    position: absolute; left: 16px; right: 16px;
    top: calc(env(safe-area-inset-top) + 60px);
    background: rgba(19, 19, 25, 0.92);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 13px;
    text-align: center;
    color: var(--text);
    display: none;
  }
  .camera-status-banner.visible { display: block; }
</style>
{% endblock %}
{% block content %}
<div class="camera-wrap" id="cameraWrap">
  <video id="cameraVideo" class="camera-video" autoplay playsinline muted></video>
  <div class="camera-status-banner" id="statusBanner"></div>
  <div class="camera-shutter-row">
    <button type="button" id="shutterBtn" class="camera-shutter-btn" aria-label="{{ t('tag.camera_shutter') }}"></button>
  </div>
</div>
<canvas id="captureCanvas" class="sr-only"></canvas>
{% endblock %}
{% block extra_scripts %}
<script>
(async () => {
  const wrap = document.getElementById("cameraWrap");
  const video = document.getElementById("cameraVideo");
  const shutterBtn = document.getElementById("shutterBtn");
  const canvas = document.getElementById("captureCanvas");
  const statusBanner = document.getElementById("statusBanner");

  const mapUrl = {{ url_for('tags.map_view') | tojson }};
  const backButtonText = {{ t('tag.camera_back_button') | tojson }};
  const locationUnavailableText = {{ t('tag.location_unavailable') | tojson }};

  function showMessage(text) {
    wrap.innerHTML =
      `<div class="camera-message"><p>${escapeHtml(text)}</p>` +
      `<a href="${mapUrl}" class="btn btn-secondary">${escapeHtml(backButtonText)}</a></div>`;
  }

  function showBanner(text) {
    statusBanner.textContent = text;
    statusBanner.classList.add("visible");
  }

  function hideBanner() {
    statusBanner.classList.remove("visible");
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMessage({{ t('tag.camera_unavailable') | tojson }});
    return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
  } catch (err) {
    showMessage({{ t('tag.camera_permission_denied') | tojson }});
    return;
  }
  video.srcObject = stream;

  let capturing = false;

  function resetShutter() {
    capturing = false;
    shutterBtn.disabled = false;
  }

  async function uploadTag(blob, clientNow, lat, lon) {
    stream.getTracks().forEach((track) => track.stop());

    const formData = new FormData();
    formData.append("photo", blob, "capture.jpg");
    formData.append("client_now", clientNow);
    formData.append("lat", lat);
    formData.append("lon", lon);

    const response = await fetch({{ url_for('tags.submit_tag') | tojson }}, {
      method: "POST",
      body: formData,
    });

    if (response.redirected) {
      window.location = response.url;
      return;
    }

    const html = await response.text();
    document.open();
    document.write(html);
    document.close();
  }

  shutterBtn.addEventListener("click", () => {
    if (capturing) return;
    capturing = true;
    shutterBtn.disabled = true;
    hideBanner();

    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const clientNow =
      `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}` +
      `T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
      if (!navigator.geolocation) {
        showBanner(locationUnavailableText);
        resetShutter();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          uploadTag(blob, clientNow, position.coords.latitude, position.coords.longitude);
        },
        () => {
          showBanner(locationUnavailableText);
          resetShutter();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }, "image/jpeg", 0.92);
  });
})();
</script>
{% endblock %}
