{% extends "base.html" %}
{% block title %}{{ t('title.feed') }} - Graffiti Wars{% endblock %}
{% block header_title %}{{ t('nav.feed') }}{% endblock %}
{% block content %}
<div class="container section" style="max-width:520px; padding-top:56px">
  <div id="feedList"></div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
  initInfiniteList({
    container: document.getElementById("feedList"),
    emptyMessage: {{ t('home.feed_empty') | tojson }},
    fetchPage: (offset, limit) => fetch(`/api/feed?offset=${offset}&limit=${limit}`).then((r) => r.json()),
    renderItem: (tag) => {
      const card = document.createElement("a");
      card.href = `/tags/${tag.id}`;
      card.className = "card feed-card mb-24";
      card.style.padding = "0";
      card.style.display = "block";

      card.innerHTML = `
        <div class="feed-card-header">
          <img class="avatar" src="${escapeHtml(tag.avatar_url)}" width="36" height="36" />
          <div class="feed-card-header-text">
            <div style="font-weight:700">${escapeHtml(tag.username)}</div>
            <div style="font-size:12px; color:${escapeHtml(tag.band_color)}">${escapeHtml(tag.band_name)}</div>
          </div>
        </div>
        <img class="feed-card-photo" src="${escapeHtml(tag.photo_url)}" />
        <div class="feed-card-footer">
          <span class="text-muted" style="font-size:12px">${tag.lat.toFixed(4)}, ${tag.lon.toFixed(4)}</span>
          <span class="text-muted" style="font-size:12px">${escapeHtml(tag.created_at)}</span>
        </div>
      `;
      return card;
    },
  });
</script>
{% endblock %}
