{% extends "base.html" %}
{% block title %}{{ t('tag.locate_title') }} - Graffiti Wars{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  #pickerMap { height: 360px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 18px; }
</style>
{% endblock %}
{% block content %}
<div class="container section" style="max-width:640px">
  <h1 style="font-size:26px; font-family:var(--font-body); font-weight:800" class="mb-16">{{ t('tag.locate_title') }}</h1>
  <p class="mb-24">{{ t('tag.locate_help') }}</p>

  <div class="card">
    <div id="pickerMap"></div>

    <form method="GET" action="{{ url_for('tags.processing') }}" class="mb-8">
      <input type="hidden" name="image_id" value="{{ image_id }}" />
      <input type="hidden" name="lat" id="lat" />
      <input type="hidden" name="lon" id="lon" />
      <button type="submit" class="btn btn-primary btn-block" id="acceptButton" disabled>{{ t('tag.accept_button') }}</button>
    </form>
    <form method="POST" action="{{ url_for('tags.cancel_submission') }}">
      <input type="hidden" name="image_id" value="{{ image_id }}" />
      <button type="submit" class="btn btn-secondary btn-block">{{ t('tag.cancel_button') }}</button>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  initLocationPicker("pickerMap", "lat", "lon", () => {
    document.getElementById("acceptButton").disabled = false;
  });
</script>
{% endblock %}
