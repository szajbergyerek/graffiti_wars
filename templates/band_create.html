{% extends "base.html" %}
{% block title %}{{ t('title.band_create') }} - Graffiti Wars{% endblock %}
{% block content %}
<div class="container section" style="max-width:560px">
  <h1 style="font-size:26px; font-family:var(--font-body); font-weight:800" class="mb-24">{{ t('band.create_title') }}</h1>
  <form method="POST" enctype="multipart/form-data" class="card">
    <div class="field">
      <label>{{ t('band.field_name') }}</label>
      <input type="text" name="name" required />
    </div>
    <div class="field">
      <label>{{ t('band.field_description') }}</label>
      <textarea name="description" rows="3"></textarea>
    </div>
    <div class="field">
      <label>{{ t('band.field_reference_image') }}</label>
      <input type="file" name="reference_image" accept="image/*" required />
      <p style="font-size:12px; margin-top:6px">{{ t('band.reference_help') }}</p>
    </div>
    <div class="field mb-24">
      <label>{{ t('band.field_join_policy') }}</label>
      <label class="flex items-center gap-8 mb-8" style="cursor:pointer">
        <input type="radio" name="join_policy" value="open" checked style="width:auto" />
        <span style="font-weight:400; color:var(--text)">{{ t('band.join_policy_open') }}</span>
      </label>
      <label class="flex items-center gap-8 mb-8" style="cursor:pointer">
        <input type="radio" name="join_policy" value="request" style="width:auto" />
        <span style="font-weight:400; color:var(--text)">{{ t('band.join_policy_request') }}</span>
      </label>
      <label class="flex items-center gap-8" style="cursor:pointer">
        <input type="radio" name="join_policy" value="invite" style="width:auto" />
        <span style="font-weight:400; color:var(--text)">{{ t('band.join_policy_invite') }}</span>
      </label>
    </div>
    <button type="submit" class="btn btn-primary btn-block">{{ t('band.create_submit') }}</button>
  </form>
</div>
{% endblock %}
