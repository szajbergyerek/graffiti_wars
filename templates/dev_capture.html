<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dev capture</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; }
  .camera-wrap { position: relative; height: 100dvh; background: #000; overflow: hidden; }
  .camera-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detection-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .camera-guidance-banner {
    position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 14px);
    transform: translateX(-50%); max-width: min(340px, 88%); padding: 12px 20px;
    border-radius: 14px; background: rgba(19, 19, 25, 0.9); color: #fff; text-align: center;
    font-weight: 700; font-size: 15px; line-height: 1.35; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    z-index: 6; display: none; font-family: -apple-system, sans-serif;
  }
  .camera-guidance-banner.visible { display: block; }
  .confidence-meter {
    position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 18px);
    transform: translateX(-50%); width: min(240px, 70%); height: 12px; border-radius: 999px;
    background: linear-gradient(90deg, #ff3b30, #ffcc00, #34c759); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    display: none; z-index: 7;
  }
  .confidence-meter.visible { display: block; }
  .confidence-meter-pointer { position: absolute; top: 100%; margin-top: 2px; transform: translateX(-50%); }
  .confidence-meter-pointer-arrow {
    width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent;
    border-bottom: 13px solid #fff;
    filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.9)) drop-shadow(0 -2px 2px rgba(0, 0, 0, 0.6));
  }
  .camera-shutter-row {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 28px);
    display: flex; justify-content: center;
  }
  .camera-shutter-btn {
    position: relative; width: 72px; height: 72px; border-radius: 999px; background: #fff;
    border: 4px solid rgba(255, 255, 255, 0.4); cursor: pointer; padding: 0;
    transition: border-color 0.2s ease;
  }
  .camera-shutter-btn:active { transform: scale(0.92); }
  .camera-shutter-btn:disabled { opacity: 0.5; }
  .camera-shutter-btn:not(:disabled) { border-color: #3ddc84; }
  .camera-shutter-btn:not(:disabled)::after {
    content: ""; position: absolute; inset: -4px; border-radius: 999px;
    border: 2px solid #3ddc84; animation: shutter-ready-pulse 1.6s ease-out infinite;
    will-change: transform, opacity; pointer-events: none;
  }
  @keyframes shutter-ready-pulse {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .camera-message {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; text-align: center; padding: 24px; color: #ccc;
    font-family: -apple-system, sans-serif;
  }
  .upload-modal-backdrop {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .upload-modal-backdrop.visible { display: flex; }
  .upload-modal {
    background: #1a1a1f; color: #fff; border-radius: 14px; padding: 24px;
    max-width: 320px; width: 100%; text-align: center;
    font-family: -apple-system, sans-serif;
  }
  .upload-modal p { margin: 0 0 20px; font-size: 14px; word-break: break-all; }
  .upload-modal button {
    background: #fff; color: #000; border: none; border-radius: 8px;
    padding: 10px 32px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
<div class="camera-wrap" id="cameraWrap"></div>
<canvas id="captureCanvas" style="display:none"></canvas>
<script>
(() => {
  const wrap = document.getElementById("cameraWrap");
  const canvas = document.getElementById("captureCanvas");
  const uploadUrl = {{ url_for('dev_capture.dev_capture_upload') | tojson }};
  const modelUrl = {{ url_for('assets.serve_model', relative_path='tag_detector.onnx') | tojson }};

  const MODEL_SIZE = 640;
  const CONF_THRESHOLD = 0.5;
  const DETECTION_INTERVAL_MS = 350;
  const MIN_TAG_AREA_FRACTION = 0.05; // tag smaller than this share of the frame -> too far away
  const TARGET_SQUARE_FRACTION = 0.62;
  const SQUARE_CORNER_RADIUS = 28;
  const DEBUG_SHOW_DETECTION_BOX = true;
  const SQUARE_BORDER_COLORS = {
    gray: "rgba(210, 210, 210, 0.9)",
    red: "rgba(255, 59, 48, 0.95)",
    green: "rgba(52, 199, 89, 0.95)",
  };

  function showMessage(text) {
    wrap.innerHTML = `<div class="camera-message"><p>${text}</p></div>`;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMessage("Camera not supported in this browser.");
    return;
  }
  if (!navigator.geolocation) {
    showMessage("Geolocation not supported in this browser.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => startCamera(position.coords.latitude, position.coords.longitude),
    () => showMessage("Location permission denied or unavailable."),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );

  async function startCamera(lat, lon) {
    wrap.innerHTML =
      `<video id="cameraVideo" class="camera-video" autoplay playsinline muted></video>` +
      `<canvas id="detectionOverlay" class="detection-overlay"></canvas>` +
      `<div class="confidence-meter" id="confidenceMeter">` +
      `<div class="confidence-meter-pointer" id="confidenceMeterPointer"><span class="confidence-meter-pointer-arrow"></span></div>` +
      `</div>` +
      `<div class="camera-guidance-banner visible" id="guidanceBanner">Loading detector...</div>` +
      `<div class="upload-modal-backdrop" id="uploadModalBackdrop">` +
      `<div class="upload-modal"><p id="uploadModalText"></p><button type="button" id="uploadModalOk">OK</button></div>` +
      `</div>` +
      `<div class="camera-shutter-row"><button type="button" id="shutterBtn" class="camera-shutter-btn" disabled></button></div>`;

    const video = document.getElementById("cameraVideo");
    const shutterBtn = document.getElementById("shutterBtn");
    const overlayCanvas = document.getElementById("detectionOverlay");
    const overlayCtx = overlayCanvas.getContext("2d");
    const confidenceMeter = document.getElementById("confidenceMeter");
    const confidenceMeterPointer = document.getElementById("confidenceMeterPointer");
    const guidanceBanner = document.getElementById("guidanceBanner");
    const modalBackdrop = document.getElementById("uploadModalBackdrop");
    const modalText = document.getElementById("uploadModalText");
    const modalOkBtn = document.getElementById("uploadModalOk");

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    } catch (err) {
      showMessage("Could not access the camera.");
      return;
    }
    video.srcObject = stream;
    await new Promise((resolve) => {
      if (video.readyState >= 2) resolve();
      else video.addEventListener("loadeddata", resolve, { once: true });
    });

    function syncOverlaySize() {
      const rect = wrap.getBoundingClientRect();
      if (overlayCanvas.width !== rect.width || overlayCanvas.height !== rect.height) {
        overlayCanvas.width = rect.width;
        overlayCanvas.height = rect.height;
      }
    }

    function getTargetSquare() {
      const size = Math.min(overlayCanvas.width, overlayCanvas.height) * TARGET_SQUARE_FRACTION;
      return {
        x: (overlayCanvas.width - size) / 2,
        y: (overlayCanvas.height - size) / 2,
        w: size,
        h: size,
      };
    }

    // A detection "counts" only if its entire box fits inside the fixed
    // target square - a box that pokes out past any edge doesn't enable the
    // shutter.
    function isFullyInsideSquare(displayRect, square) {
      return (
        displayRect.x >= square.x &&
        displayRect.y >= square.y &&
        displayRect.x + displayRect.w <= square.x + square.w &&
        displayRect.y + displayRect.h <= square.y + square.h
      );
    }

    function drawOverlay(square, state, debugDisplayRect) {
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      overlayCtx.fillStyle = "rgba(0, 0, 0, 0.55)";
      overlayCtx.fillRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      overlayCtx.save();
      overlayCtx.globalCompositeOperation = "destination-out";
      overlayCtx.beginPath();
      overlayCtx.roundRect(square.x, square.y, square.w, square.h, SQUARE_CORNER_RADIUS);
      overlayCtx.fill();
      overlayCtx.restore();

      overlayCtx.strokeStyle = SQUARE_BORDER_COLORS[state];
      overlayCtx.lineWidth = 3;
      overlayCtx.beginPath();
      overlayCtx.roundRect(square.x, square.y, square.w, square.h, SQUARE_CORNER_RADIUS);
      overlayCtx.stroke();

      if (DEBUG_SHOW_DETECTION_BOX && debugDisplayRect) {
        overlayCtx.save();
        overlayCtx.strokeStyle = "rgba(255, 204, 0, 0.95)";
        overlayCtx.lineWidth = 2;
        overlayCtx.setLineDash([8, 6]);
        overlayCtx.strokeRect(debugDisplayRect.x, debugDisplayRect.y, debugDisplayRect.w, debugDisplayRect.h);
        overlayCtx.restore();
      }
    }

    function updateConfidenceMeter(confidence) {
      if (confidence == null) {
        confidenceMeter.classList.remove("visible");
        return;
      }
      confidenceMeter.classList.add("visible");
      const normalized = (confidence - CONF_THRESHOLD) / (1 - CONF_THRESHOLD);
      const percent = Math.max(0, Math.min(1, normalized)) * 100;
      confidenceMeterPointer.style.left = `${percent}%`;
    }

    function setGuidanceText(text) {
      if (text == null) {
        guidanceBanner.classList.remove("visible");
        return;
      }
      guidanceBanner.textContent = text;
      guidanceBanner.classList.add("visible");
    }

    syncOverlaySize();
    drawOverlay(getTargetSquare(), "gray");

    let session;
    try {
      ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/";
      session = await ort.InferenceSession.create(modelUrl, { executionProviders: ["wasm"] });
    } catch (err) {
      showMessage("Could not load the tag-detection model.");
      return;
    }

    const preCanvas = document.createElement("canvas");
    preCanvas.width = MODEL_SIZE;
    preCanvas.height = MODEL_SIZE;
    const preCtx = preCanvas.getContext("2d", { willReadFrequently: true });

    function preprocessFrame() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const scale = Math.min(MODEL_SIZE / vw, MODEL_SIZE / vh);
      const nw = Math.round(vw * scale);
      const nh = Math.round(vh * scale);
      const padX = Math.floor((MODEL_SIZE - nw) / 2);
      const padY = Math.floor((MODEL_SIZE - nh) / 2);

      preCtx.fillStyle = "rgb(114, 114, 114)";
      preCtx.fillRect(0, 0, MODEL_SIZE, MODEL_SIZE);
      preCtx.drawImage(video, 0, 0, vw, vh, padX, padY, nw, nh);

      const { data } = preCtx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);
      const pixelCount = MODEL_SIZE * MODEL_SIZE;
      const input = new Float32Array(3 * pixelCount);
      for (let i = 0; i < pixelCount; i++) {
        input[i] = data[i * 4] / 255;
        input[pixelCount + i] = data[i * 4 + 1] / 255;
        input[2 * pixelCount + i] = data[i * 4 + 2] / 255;
      }
      return { input, scale, padX, padY };
    }

    async function detectBestTag() {
      const { input, scale, padX, padY } = preprocessFrame();
      const tensor = new ort.Tensor("float32", input, [1, 3, MODEL_SIZE, MODEL_SIZE]);
      const feeds = {};
      feeds[session.inputNames[0]] = tensor;
      const outputs = await session.run(feeds);
      const output = outputs[session.outputNames[0]];
      const data = output.data;
      const numAnchors = output.dims[2];

      let bestIdx = -1;
      let bestConf = 0;
      for (let i = 0; i < numAnchors; i++) {
        const conf = data[4 * numAnchors + i];
        if (conf > bestConf) {
          bestConf = conf;
          bestIdx = i;
        }
      }

      if (bestConf < CONF_THRESHOLD) return null;

      const cx = data[bestIdx];
      const cy = data[numAnchors + bestIdx];
      const bw = data[2 * numAnchors + bestIdx];
      const bh = data[3 * numAnchors + bestIdx];

      return {
        x1: Math.max(0, (cx - bw / 2 - padX) / scale),
        y1: Math.max(0, (cy - bh / 2 - padY) / scale),
        x2: Math.min(video.videoWidth, (cx + bw / 2 - padX) / scale),
        y2: Math.min(video.videoHeight, (cy + bh / 2 - padY) / scale),
        conf: bestConf,
      };
    }

    function toDisplayRect(box) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const displayScale = Math.max(overlayCanvas.width / vw, overlayCanvas.height / vh);
      const offsetX = (overlayCanvas.width - vw * displayScale) / 2;
      const offsetY = (overlayCanvas.height - vh * displayScale) / 2;
      return {
        x: box.x1 * displayScale + offsetX,
        y: box.y1 * displayScale + offsetY,
        w: (box.x2 - box.x1) * displayScale,
        h: (box.y2 - box.y1) * displayScale,
      };
    }

    let currentDetection = null;
    let capturing = false;
    let detecting = false;

    async function detectionTick() {
      if (capturing || detecting) return;
      detecting = true;
      let detection = null;
      try {
        detection = await detectBestTag();
      } catch (err) {
        detection = null;
      }
      detecting = false;

      syncOverlaySize();
      const square = getTargetSquare();
      const displayRect = detection ? toDisplayRect(detection) : null;
      const overflowsSquare = displayRect != null && (displayRect.w > square.w || displayRect.h > square.h);
      const inArea = displayRect != null && isFullyInsideSquare(displayRect, square);
      const areaFraction = detection
        ? ((detection.x2 - detection.x1) * (detection.y2 - detection.y1)) / (video.videoWidth * video.videoHeight)
        : 0;
      const tagFound = inArea && areaFraction >= MIN_TAG_AREA_FRACTION;
      currentDetection = tagFound ? detection : null;

      let guidanceText;
      if (!detection) {
        guidanceText = "Show the tag";
      } else if (overflowsSquare) {
        guidanceText = "Move farther away";
      } else if (!inArea) {
        guidanceText = "Place it inside the marked area";
      } else if (areaFraction < MIN_TAG_AREA_FRACTION) {
        guidanceText = "Move closer";
      }

      drawOverlay(square, tagFound ? "green" : "red", displayRect);
      if (tagFound) {
        updateConfidenceMeter(currentDetection.conf);
        setGuidanceText(null);
      } else {
        updateConfidenceMeter(null);
        setGuidanceText(guidanceText);
      }
      if (!capturing) shutterBtn.disabled = !currentDetection;
    }

    setInterval(detectionTick, DETECTION_INTERVAL_MS);
    detectionTick();

    shutterBtn.addEventListener("click", () => {
      if (capturing || !currentDetection) return;
      capturing = true;
      shutterBtn.disabled = true;

      const capturedAt = new Date().toISOString();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append("photo", blob, "capture.jpg");
        formData.append("lat", lat);
        formData.append("lon", lon);
        formData.append("captured_at", capturedAt);

        try {
          const response = await fetch(uploadUrl, { method: "POST", body: formData });
          const data = await response.json();
          modalText.textContent = data.ok ? `Saved: ${data.filename}` : "Save failed.";
        } catch (err) {
          modalText.textContent = "Save failed.";
        }
        modalBackdrop.classList.add("visible");
      }, "image/jpeg", 0.92);
    });

    modalOkBtn.addEventListener("click", () => {
      modalBackdrop.classList.remove("visible");
      capturing = false;
    });
  }
})();
</script>
</body>
</html>
