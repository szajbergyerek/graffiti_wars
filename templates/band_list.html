{% extends "base.html" %}
{% block title %}{{ t('title.bands') }} - InkTrail{% endblock %}
{% block header_title %}{{ t('nav.bands') }}{% endblock %}
{% block content %}
<div class="container section">
  <a href="{{ url_for('leaderboard.leaderboard_page') }}" class="btn btn-primary btn-block mb-24">
    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-right:6px"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a3 3 0 0 0 3 4"/><path d="M17 5h3a3 3 0 0 1-3 4"/></svg>
    {{ t('title.leaderboard') }}
  </a>
  <form method="GET" id="bandFilterForm">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" name="q" value="{{ query_text }}" placeholder="{{ t('band.search_placeholder') }}" />
    </div>
    <div class="filter-chip-row">
      <select name="sort" onchange="this.form.submit()">
        <option value="newest" {{ "selected" if sort_key == "newest" else "" }}>{{ t('band.sort_newest') }}</option>
        <option value="area" {{ "selected" if sort_key == "area" else "" }}>{{ t('band.sort_area') }}</option>
        <option value="members" {{ "selected" if sort_key == "members" else "" }}>{{ t('band.sort_members') }}</option>
        <option value="tags" {{ "selected" if sort_key == "tags" else "" }}>{{ t('band.sort_tags') }}</option>
      </select>
      <select name="join_policy" onchange="this.form.submit()">
        <option value="all" {{ "selected" if join_policy_filter == "all" else "" }}>{{ t('band.filter_all') }}</option>
        <option value="open" {{ "selected" if join_policy_filter == "open" else "" }}>{{ t('band.open_badge') }}</option>
        <option value="request" {{ "selected" if join_policy_filter == "request" else "" }}>{{ t('band.request_badge') }}</option>
        <option value="invite" {{ "selected" if join_policy_filter == "invite" else "" }}>{{ t('band.invite_badge') }}</option>
      </select>
    </div>
    <div class="segmented mb-24">
      <button type="button" class="segmented-item {{ 'active' if scope == 'global' else '' }}" onclick="setBandScope('global')">{{ t('leaderboard.tab_global') }}</button>
      <button type="button" class="segmented-item {{ 'active' if scope == 'national' else '' }}" onclick="setBandScope('national')">{{ t('leaderboard.tab_national') }}</button>
      <button type="button" class="segmented-item {{ 'active' if scope == 'local' else '' }}" onclick="setBandScope('local')">{{ t('leaderboard.tab_local') }}</button>
    </div>
    <input type="hidden" name="scope" id="scopeInput" value="{{ scope }}" />
    <input type="hidden" name="lat" id="latInput" value="{{ request.args.get('lat', '') }}" />
    <input type="hidden" name="lon" id="lonInput" value="{{ request.args.get('lon', '') }}" />
  </form>

  <div class="grid grid-3" id="bandsList"></div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
  function setBandScope(scope) {
    document.getElementById("scopeInput").value = scope;
    const form = document.getElementById("bandFilterForm");
    if (scope === "local" && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          document.getElementById("latInput").value = position.coords.latitude;
          document.getElementById("lonInput").value = position.coords.longitude;
          form.submit();
        },
        () => form.submit()
      );
    } else {
      form.submit();
    }
  }

  const bandBadges = {
    open: `<span class="badge badge-success">${escapeHtml({{ t('band.open_badge') | tojson }})}</span>`,
    request: `<span class="badge badge-yellow">${escapeHtml({{ t('band.request_badge') | tojson }})}</span>`,
    invite: `<span class="badge badge-muted">${escapeHtml({{ t('band.invite_badge') | tojson }})}</span>`,
  };

  const bandsListParams = new URLSearchParams({
    q: {{ query_text | tojson }},
    sort: {{ sort_key | tojson }},
    scope: {{ scope | tojson }},
    join_policy: {{ join_policy_filter | tojson }},
    lat: {{ request.args.get('lat', '') | tojson }},
    lon: {{ request.args.get('lon', '') | tojson }},
  });

  initInfiniteList({
    container: document.getElementById("bandsList"),
    emptyMessage: {{ t('band.none_yet') | tojson }},
    fetchPage: (offset, limit) => {
      const params = new URLSearchParams(bandsListParams);
      params.set("offset", offset);
      params.set("limit", limit);
      return fetch(`/bands/api/list?${params}`).then((r) => (r.ok ? r.json() : []));
    },
    renderItem: (band) => {
      const card = document.createElement("a");
      card.href = `/bands/${band.band_id}`;
      card.className = "card";

      const memberLabel = band.member_count === 1 ? {{ t('common.member') | tojson }} : {{ t('common.members') | tojson }};
      const tagLabel = band.tag_count === 1 ? {{ t('common.tag') | tojson }} : {{ t('common.tags') | tojson }};

      card.innerHTML = `
        <div class="flex items-center gap-12 mb-16">
          <div style="width:44px;height:44px;border-radius:10px;background:${escapeHtml(band.color)}"></div>
          <div style="font-weight:700">${escapeHtml(band.name)}</div>
        </div>
        <p>${escapeHtml(band.description || {{ t('band.no_description') | tojson }})}</p>
        <div style="margin-top:16px">
          <span class="badge badge-muted">${band.member_count} ${escapeHtml(memberLabel)}</span>
          <span class="badge badge-muted">${band.tag_count} ${escapeHtml(tagLabel)}</span>
          <span class="badge" style="background:${escapeHtml(band.color)}22; color:${escapeHtml(band.color)}">${band.area_km2} km2</span>
          ${bandBadges[band.join_policy] || ""}
        </div>
      `;
      return card;
    },
  });
</script>
{% endblock %}
